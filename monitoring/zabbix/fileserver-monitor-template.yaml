  triggers:
    - uuid: ba8cc84ff4ab4902a416070eb257a817
      expression: 'last(/Template App FileServer Monitor/fileserver.api.status)<>"healthy"'
      name: 'FileServer Monitor: ambiente nao esta healthy'
      priority: WARNING
    - uuid: 9a3dec8ac473451aae4b20b474211911
      expression: 'last(/Template App FileServer Monitor/fileserver.db.status)<>"healthy"'
      name: 'FileServer Monitor: banco indisponivel ou degradado'
      priority: HIGH
    - uuid: 2223ebcadca04c208f4141483fa200a9
      expression: 'last(/Template App FileServer Monitor/fileserver.capacity.status)="critical"'
      name: 'FileServer Monitor: falha ao medir capacidade do banco'
      priority: WARNING
    - uuid: 48d26932366245d3b20a8c6448029774
      expression: 'last(/Template App FileServer Monitor/fileserver.capacity.reserved_mb)>={$FILESERVER_MONITOR_DB_RESERVED_WARN_MB}'
      name: 'FileServer Monitor: capacidade reservada do banco acima do limite'
      priority: WARNING
    - uuid: 9860d80cdc154545b2fc3213b57e35eb
      expression: 'last(/Template App FileServer Monitor/fileserver.timeline.queue.status)="critical"'
      name: 'FileServer Monitor: fila de materializacao critica'
      priority: HIGH
    - uuid: 5862daa88a224878a1f7debd4dd14484
      expression: 'last(/Template App FileServer Monitor/fileserver.timeline.queue.total)>={$FILESERVER_MONITOR_TIMELINE_QUEUE_WARN}'
      name: 'FileServer Monitor: fila de materializacao acumulando jobs'
      priority: WARNING
    - uuid: ebdd2a8d4ef24404b947aa7298c60766
      expression: 'last(/Template App FileServer Monitor/fileserver.timeline.queue.oldest_age_seconds)>{$FILESERVER_MONITOR_TIMELINE_QUEUE_MAX_AGE}'
      name: 'FileServer Monitor: materializacao da timeline atrasada'
      priority: WARNING
    - uuid: 1754a9fce9f94a7d80e865adc428883e
      expression: 'last(/Template App FileServer Monitor/fileserver.timeline.queue.retrying)>0'
      name: 'FileServer Monitor: job da timeline em repeticao'
      priority: WARNING
    - uuid: b80b97d6edbd4400801359435c3b7d93
      expression: 'last(/Template App FileServer Monitor/fileserver.agents.total)=0'
      name: 'FileServer Monitor: nenhum agente registrado'
      priority: HIGH
    - uuid: 32091dc2b90642f295ffabf6a24b3fe4
      expression: 'last(/Template App FileServer Monitor/fileserver.agents.stale)>0'
      name: 'FileServer Monitor: agente sem heartbeat'
      priority: HIGH
    - uuid: b342a34ee4da42a9b645d3ef139dc79c
      expression: 'last(/Template App FileServer Monitor/fileserver.agents.unhealthy)>0'
      name: 'FileServer Monitor: agente em estado nao saudavel'
      priority: WARNING
    - uuid: b4f270728ec64ffbbae0ff428c56816e
      expression: 'last(/Template App FileServer Monitor/fileserver.agents.critical)>0'
      name: 'FileServer Monitor: agente em estado critico'
      priority: HIGH
    - uuid: 93d0bdc4efe940eba95c3f51219d46e3
      expression: 'last(/Template App FileServer Monitor/fileserver.agents.cycle_errors)>0'
      name: 'FileServer Monitor: erro no ultimo ciclo do agente'
      priority: WARNING
    - uuid: 9f1210c43ddb4fcc82e1be33040c2c16
      expression: 'last(/Template App FileServer Monitor/fileserver.agents.max_pending_queue)>={$FILESERVER_MONITOR_QUEUE_WARN}'
      name: 'FileServer Monitor: fila local do agente alta'
      priority: WARNING
    - uuid: a6cde95de7944237ae663cf91e2dfef6
      expression: 'last(/Template App FileServer Monitor/fileserver.agents.max_collected_event_age_seconds)>{$FILESERVER_MONITOR_LAST_EVENT_MAX_AGE}'
      name: 'FileServer Monitor: agente sem coletar eventos recentes'
      priority: INFO
    - uuid: c1092e359fc24965a7e506d313cfd546
      expression: 'last(/Template App FileServer Monitor/fileserver.events.last_age_seconds)>{$FILESERVER_MONITOR_LAST_EVENT_MAX_AGE}'
      name: 'FileServer Monitor: sem eventos recentes'
      priority: INFO
    - uuid: 0a074734be6541f38f6579ee8571abca
      expression: 'last(/Template App FileServer Monitor/fileserver.inventory.status)="empty"'
      name: 'FileServer Monitor: inventario ainda sem snapshot'
      priority: INFO
    - uuid: 5027a807f58e44c9a9328d0860cdfb2c
      expression: 'last(/Template App FileServer Monitor/fileserver.inventory.status)="critical"'
      name: 'FileServer Monitor: inventario com falha critica'
      priority: HIGH
    - uuid: f4d4b88674e149a0bad6388439cf02a6
      expression: 'last(/Template App FileServer Monitor/fileserver.inventory.errors)>0'
      name: 'FileServer Monitor: inventario com erros de leitura'
      priority: WARNING
    - uuid: 9925b8390f954cb8ac76dcf5f189cfb2
      expression: 'last(/Template App FileServer Monitor/fileserver.inventory.last_scan_age_seconds)>{$FILESERVER_MONITOR_INVENTORY_MAX_AGE} and last(/Template App FileServer Monitor/fileserver.inventory.files)>0'
      name: 'FileServer Monitor: inventario desatualizado'
      priority: WARNING
    - uuid: f33c8d32b2344187b39b2d2196f31c72
      expression: 'last(/Template App FileServer Monitor/fileserver.inventory.executable_files)>0'
      name: 'FileServer Monitor: executaveis ou scripts encontrados no compartilhamento'
      priority: INFO
    - uuid: d967b8a1887d4184a5b80853336592c2
      expression: 'last(/Template App FileServer Monitor/fileserver.retention.last_status)="failed"'
      name: 'FileServer Monitor: ultima retencao falhou'
      priority: HIGH
    - uuid: 754461aff1ce47089e13c15302457c29
      expression: 'last(/Template App FileServer Monitor/fileserver.retention.last_duration_ms)>{$FILESERVER_MONITOR_RETENTION_MAX_DURATION_MS}'
      name: 'FileServer Monitor: retencao acima da duracao esperada'
      priority: WARNING
    - uuid: 225212887ae3438e85764ac4767c67a3
      expression: 'last(/Template App FileServer Monitor/fileserver.retention.enabled)=1 and last(/Template App FileServer Monitor/fileserver.retention.archive_available)=0'
      name: 'FileServer Monitor: retencao ativa sem arquivo frio disponivel'
      priority: HIGH
